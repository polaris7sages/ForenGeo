name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run lint checks
        run: flake8 . --max-line-length=120

      - name: Compile python files
        run: python -m compileall forensic_h3_fixed.py fh3_cli.py fh3_web.py map_visualizer.py deepweb_forensics.py

      - name: Run deterministic tests
        run: pytest -q test_devsecops.py

      - name: Dependency security audit
        run: pip-audit -r requirements.txt

      - name: Static security scan
        run: bandit -r . -x .venv -lll

  build-and-push-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/forengeo:latest

      - name: Notify
        run: echo "Docker image pushed to ghcr.io/${{ github.repository_owner }}/forengeo:latest"

      - name: Scan repository with Trivy (fs)
        uses: aquasecurity/trivy-action@v1.4.0
        with:
          scan-type: 'fs'
          vuln-type: 'os,library'
          format: 'table'
